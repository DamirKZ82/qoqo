# Таблицы [project] здесь намеренно нет.
#
# Сборщик Python на Vercel, найдя [project], считает pyproject.toml источником
# зависимостей и ставит объявленное в нём, а requirements.txt не смотрит вовсе.
# Таблица была без dependencies, поэтому функция разворачивалась пустой и падала
# на импорте: ModuleNotFoundError: No module named 'fastapi'.
#
# Список зависимостей один — requirements.txt. Если [project] понадобится,
# зависимости придётся перенести туда целиком, а не держать в двух местах:
# разойдутся они молча, а узнается об этом на боевом контуре.
#
# Версия Python задана файлом .python-version, ruff берёт свою из target-version.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Комментарии и строки на русском — кириллица здесь намеренная, не опечатка.
    "RUF001",
    "RUF002",
    "RUF003",
    # Generic[T] в pydantic-моделях надёжнее синтаксиса PEP 695.
    "UP046",
]

[tool.ruff.lint.flake8-bugbear]
# Объявление зависимостей в значениях аргументов — штатный приём FastAPI.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
