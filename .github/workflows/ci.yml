name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Чтобы можно было прогнать проверки руками, не дожидаясь пуша.
  workflow_dispatch:

# Новый пуш в ветку отменяет предыдущий запуск: гонять проверки на устаревшем
# коммите смысла нет.
concurrency:
  group: ci-${{ github.ref }}
  # На ветках новый пуш отменяет прежний прогон — гонять проверки на устаревшем
  # коммите смысла нет. На main отмену выключаем: там в конце идёт миграция
  # боевой базы, и обрывать её на середине нельзя.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qoqoback
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: qoqoback/.python-version
          cache: pip
          cache-dependency-path: |
            qoqoback/requirements.txt
            qoqoback/requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Форматирование
        run: ruff format --check .

      - name: Тесты
        run: python -m pytest -q

      # Приложение должно подниматься там, где файловая система только для
      # чтения, — иначе деплой на Vercel падает ещё на импорте.
      - name: Точка входа Vercel
        env:
          VERCEL: '1'
          # Пути, по которым каталог не создать: так на бегущем CI
          # воспроизводится файловая система только для чтения. Настройка логов
          # и раздача загрузок выполняются при импорте модуля, поэтому
          # необработанная ошибка там роняет приложение целиком.
          MEDIA_ROOT: /dev/null/media
          LOG_FILE: /dev/null/logs/qoqo.log
        run: |
          python - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location('vercel_entry', 'api/index.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          from app.db.session import engine

          import logging

          assert module.app.title, 'приложение не собралось'
          assert not any(
              isinstance(h, logging.FileHandler) for h in logging.getLogger().handlers
          ), 'журнал не должен писаться в файл там, где файловая система только для чтения'
          assert type(engine.pool).__name__ == 'NullPool', 'пул соединений не отключён'
          assert not any(getattr(r, 'path', '') == '/media' for r in module.app.routes), (
              'раздача /media не должна подключаться без записываемого каталога'
          )
          print('точка входа в порядке')
          PY

  migrations:
    name: Миграции
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qoqoback

    # Миграции проверяются на настоящей базе: расхождение моделей и схемы или
    # сломанный upgrade иначе всплывут только на деплое.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qoqo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/qoqo
      SECRET_KEY: ci-secret-not-used-anywhere
      DEBUG: 'false'

    steps:
      - uses: actions/checkout@v7
        with:
          # Проверке ниже нужен предыдущий коммит: без истории не понять,
          # какие миграции добавлены именно этим изменением.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: qoqoback/.python-version
          cache: pip
          cache-dependency-path: qoqoback/requirements.txt

      # Схема и код меняются не одновременно: во время выкатки старые процессы
      # ещё живы. Миграция, ломающая предыдущую версию кода, должна быть
      # осознанной, а не случайной.
      - name: Миграции не ломают работающий код
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          # Первый пуш в ветку или force push: сравнивать не с чем.
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            base=$(git rev-parse --verify --quiet HEAD~1 || git rev-parse HEAD)
          fi
          files=$(git diff --name-only "$base" HEAD -- qoqoback/alembic/versions)
          python qoqoback/tools/check_migrations.py $files

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Накатить миграции
        run: alembic upgrade head

      - name: Стартовые данные
        run: python -m app.scripts.seed

      - name: Схема совпадает с моделями
        # Автогенерация на накатанной базе обязана дать пустую миграцию.
        # Если в ней появились операции — модель поменяли, а миграцию забыли.
        run: |
          alembic revision --autogenerate --rev-id drift -m drift-check
          file=alembic/versions/drift_drift_check.py
          test -f "$file" || { echo '::error::Alembic не создал файл ревизии'; exit 1; }
          if grep -qE '^\s+op\.' "$file"; then
            echo '::error::Схема разошлась с моделями — не хватает миграции'
            sed -n '/def upgrade/,/def downgrade/p' "$file"
            exit 1
          fi

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qoqofront
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qoqofront/package-lock.json

      - name: Зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      # Сборка заодно проверяет типы: казахский словарь обязан совпасть с
      # русским по составу ключей, иначе tsc не пройдёт.
      - name: Сборка
        run: npm run build

  deploy-migrations:
    name: Миграции боевой базы
    runs-on: ubuntu-latest
    # Только после зелёных проверок и только с main: схему боевой базы не
    # меняем по пушу в ветку и уж тем более по пулл-реквесту извне.
    needs: [backend, migrations, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Отдельная очередь: два одновременных прогона не должны накатывать схему
    # наперегонки. Отмену не включаем — начатую миграцию не прерываем.
    concurrency:
      group: prod-migrations
      cancel-in-progress: false

    # Через окружение в настройках репозитория можно потребовать подтверждение
    # человеком перед изменением схемы: Settings → Environments → production.
    environment: production

    defaults:
      run:
        working-directory: qoqoback

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: qoqoback/.python-version
          cache: pip
          cache-dependency-path: qoqoback/requirements.txt

      # Пока секрет не заведён, шаг не должен красить сборку: репозиторий
      # существует и без боевой базы.
      - name: Есть ли доступ к базе
        id: guard
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo '::notice::Секрет PROD_DATABASE_URL не задан — миграции боевой базы пропущены'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Зависимости
        if: steps.guard.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: На чём база сейчас
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: not-used-for-migrations
        run: alembic current

      - name: Что будет применено
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: not-used-for-migrations
        # Список недостающих шагов до того, как они выполнятся: если что-то
        # пойдёт не так, в логе останется, с чего начинали.
        run: alembic history --rev-range current:head

      - name: Накатить
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: not-used-for-migrations
        run: alembic upgrade head

      - name: На чём база стала
        if: steps.guard.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: not-used-for-migrations
        run: alembic current
